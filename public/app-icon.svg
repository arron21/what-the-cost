<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="needGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="wantGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Rounded App Background -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="111" fill="none" stroke="#334155" stroke-width="6" opacity="0.6"/>

  <!-- Left: Needs Arch (Blue) -->
  <path d="M 170 120 C 230 120, 246 160, 246 256 C 246 352, 230 392, 170 392 C 110 392, 110 120, 170 120 Z" 
        fill="url(#needGrad)" opacity="0.9" filter="url(#glow)"/>

  <!-- Right: Wants Arch (Pink) -->
  <path d="M 342 120 C 402 120, 402 392, 342 392 C 282 392, 266 352, 266 256 C 266 160, 282 120, 342 120 Z" 
        fill="url(#wantGrad)" opacity="0.9" filter="url(#glow)"/>

  <!-- Center Divide / Scale Symbol -->
  <circle cx="256" cy="256" r="42" fill="#0f172a" stroke="#f8fafc" stroke-width="8"/>
  <text x="256" y="272" font-family="-apple-system, system-ui, sans-serif" font-size="44" font-weight="900" fill="#f8fafc" text-anchor="middle">$</text>

  <!-- Subtitle Text -->
  <text x="256" y="446" font-family="-apple-system, system-ui, sans-serif" font-size="30" font-weight="700" letter-spacing="4" fill="#94a3b8" text-anchor="middle">WHAT THE COST</text>
</svg>
